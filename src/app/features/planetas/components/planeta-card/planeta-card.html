@let p = planeta();

<article class="flex flex-col overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm">
  <div class="flex justify-center bg-linear-to-b from-ki-100 to-ki-50 p-4">
    @if (imagenFallo()) {
      <svg lucideImageOff class="my-12 size-12 text-stone-400"></svg>
    } @else {
      <img [src]="p.image" [alt]="p.name" loading="lazy" (error)="imagenFallo.set(true)" class="h-auto w-full object-contain" />
    }
  </div>

  <div class="flex flex-col gap-2 p-4">
    <h3 class="text-lg font-semibold leading-tight">{{ p.name }}</h3>

    @if (p.isDestroyed) {
      <span class="w-fit rounded-full bg-red-600 px-2 py-0.5 text-xs font-medium text-white">Destruido</span>
    }

    <p class="line-clamp-4 text-sm text-stone-600">{{ p.description }}</p>
  </div>
</article>
